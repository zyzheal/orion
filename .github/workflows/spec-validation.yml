name: Spec Validation

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
  schedule:
    # 每天 UTC 00:00 运行一次（项目基准检查）
    - cron: '0 0 * * *'

env:
  NODE_VERSION: '20'

jobs:
  # ==================== Spec Acceptance Criteria Check ====================

  spec-acceptance-check:
    name: Spec Acceptance Criteria Validation
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run Spec Acceptance Criteria Check
        id: spec-check
        run: npx tsx scripts/check-spec-acceptance.ts --min-criteria 3
        working-directory: .

      - name: Upload Spec Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-validation-report
          path: |
            docs/specs/acceptance-criteria-report.json
            docs/specs/acceptance-criteria-traceability.md
          retention-days: 30
          if-no-files-found: warn

      - name: Comment on PR (acceptance criteria results)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## Spec Validation\n\n';

            try {
              const reportPath = 'docs/specs/acceptance-criteria-report.json';
              if (fs.existsSync(reportPath)) {
                const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                const { summary: s, results } = report;
                const failed = results.filter((r: any) => !r.pass);
                summary += `| Metric | Value |\n|--------|-------|\n`;
                summary += `| Total Specs | ${s.total} |\n`;
                summary += `| Passed | ${s.passed} |\n`;
                summary += `| Failed | ${s.failed} |\n`;
                summary += `| Pass Rate | ${s.pass_rate}% |\n\n`;

                if (failed.length > 0) {
                  summary += `### ❌ Failed Specs (${failed.length})\n\n`;
                  for (const r of failed) {
                    summary += `- **${r.file}**\n`;
                    for (const issue of r.issues) {
                      summary += `  - ${issue}\n`;
                    }
                  }
                  summary += '\n';
                } else {
                  summary += `All specs passed acceptance criteria. ✅\n\n`;
                }
              } else {
                summary += '_No JSON report was generated._\n';
              }
            } catch (e) {
              summary += `_Report parsing error: ${e.message}_\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary,
            });

  # ==================== Spec Traceability Matrix Check ====================

  spec-traceability-check:
    name: Spec Traceability Matrix Check
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: spec-acceptance-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Verify traceability matrix exists
        id: matrix-check
        run: |
          if [ ! -f "docs/specs/traceability-matrix.md" ]; then
            echo "ERROR: traceability-matrix.md not found at docs/specs/traceability-matrix.md"
            exit 1
          fi
          echo "Traceability matrix found."
          wc -l docs/specs/traceability-matrix.md

      - name: Check traceability matrix completeness
        id: matrix-completeness
        run: |
          count=$(grep -cE '`docs/(specs|services/.+/spec)\.md`' docs/specs/traceability-matrix.md || true)
          echo "Specs referenced in traceability matrix: $count"
          if [ "$count" -lt 5 ]; then
            echo "ERROR: traceability matrix references fewer than 5 specs (found: $count)"
            exit 1
          fi
          echo "Traceability matrix completeness check passed ($count specs referenced)."

  # ==================== Spec Traceability Script Run ====================

  spec-traceability-run:
    name: Spec Traceability Verification
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: spec-acceptance-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run Spec Traceability Verification
        id: traceability-run
        run: npm run verify:specs
        working-directory: .

      - name: Upload Traceability Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-traceability-report
          path: |
            docs/specs/spec-traceability-report.json
            docs/specs/spec-traceability-matrix.md
          retention-days: 30
          if-no-files-found: warn
