# Go Microservices CI
#
# Runs tests, vet, and build for all Go services.
# Triggers on changes to any Go service directory.

name: Go Services

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'orion-*-svc-go/**'
      - 'orion-api-gateway-go/**'
  pull_request:
    branches: [main]
    paths:
      - 'orion-*-svc-go/**'
      - 'orion-api-gateway-go/**'

env:
  GO_VERSION: '1.25'

jobs:
  # ==================== Go Service Tests ====================

  go-test:
    name: Go Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - orion-ticket-svc-go
          - orion-api-gateway-go
          - orion-cmdb-svc-go
          - orion-monitor-svc-go
          - orion-pipeline-svc-go
          - orion-build-svc-go
          - orion-deploy-svc-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: ${{ matrix.service }}

      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.service }}

      - name: Test
        run: go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
        working-directory: ${{ matrix.service }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.service }}-coverage
          path: ${{ matrix.service }}/coverage.out
          retention-days: 30

      - name: Build
        run: go build -o /dev/null ./...
        working-directory: ${{ matrix.service }}

  # ==================== Go Docker Build ====================

  go-docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: go-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - orion-ticket-svc-go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
