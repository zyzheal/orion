name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.25'

jobs:
  # ==================== Lint ====================

  lint:
    name: Lint & Format (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, frontend]
        include:
          - service: api-gateway
            dir: orion-api-gateway
          - service: frontend
            dir: orion-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.dir }}

      - name: Lint
        continue-on-error: true
        run: npm run lint
        working-directory: ${{ matrix.dir }}

  # ==================== Type Check ====================

  type-check:
    name: Type Check (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [api-gateway, frontend]
        include:
          - service: api-gateway
            dir: orion-api-gateway
          - service: frontend
            dir: orion-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.dir }}

      - name: Type check
        run: npm run type-check
        working-directory: ${{ matrix.dir }}

  # ==================== Design Constraint Check ====================

  design-constraint:
    name: Design Constraint Check
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-frontend

      - name: Run Design Constraint AST Scan
        run: |
          npx tsx docs/design-constraints/framework/core/cli-check.ts \
            --scan orion-frontend/src/pages/ \
            --max-files 100 \
            --format json > design-constraint-results.json || true
          echo "=== Design Constraint Results ==="
          cat design-constraint-results.json | head -100

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-constraint-results
          path: design-constraint-results.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Design Constraint Check completed.';
            try {
              const results = JSON.parse(fs.readFileSync('design-constraint-results.json', 'utf8'));
              if (results.issues && results.issues.length > 0) {
                summary = `Found ${results.issues.length} design constraint issues.`;
              }
            } catch (e) {
              summary = 'Design Constraint Check completed (parse error).';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Design Constraint\n${summary}`
            });

  # ==================== API Gateway Tests ====================

  api-gateway-test:
    name: API Gateway Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-api-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-api-gateway

      - name: Run tests
        run: npm run test:coverage
        working-directory: orion-api-gateway

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-coverage
          path: orion-api-gateway/coverage/lcov.info
          retention-days: 30

      - name: Build
        run: npm run build
        working-directory: orion-api-gateway

  # ==================== Frontend Tests ====================

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-frontend

      - name: Run tests
        run: npm run test -- --coverage --coverageThreshold='{"global":{"lines":60}}'
        working-directory: orion-frontend

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: orion-frontend/coverage/lcov.info
          retention-days: 30

      - name: Build
        run: npm run build
        working-directory: orion-frontend

  # ==================== Go Service Tests ====================

  go-test:
    name: Go Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - orion-platform-svc-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: ${{ matrix.service }}

      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.service }}

      - name: Test
        run: go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
        working-directory: ${{ matrix.service }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.service }}-coverage
          path: ${{ matrix.service }}/coverage.out
          retention-days: 30

      - name: Build
        run: go build -trimpath ./cmd/server
        working-directory: ${{ matrix.service }}

  # ==================== Orion DBA Frontend Build ====================

  orion-dba-frontend-build:
    name: Orion DBA Frontend Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: orion-dba/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-dba/frontend

      - name: Build (with type check)
        continue-on-error: true
        run: npm run build
        working-directory: orion-dba/frontend

  # ==================== Orion AI Service (Python) ====================

  orion-ai-service-test:
    name: Orion AI Service Tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: orion-ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: orion-ai-service

      - name: Run tests
        continue-on-error: true
        run: python -m pytest tests/ -v --tb=short
        working-directory: orion-ai-service

  # ==================== Orion Knowledge Backend (Go) ====================

  orion-knowledge-backend-build:
    name: Orion Knowledge Backend Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: orion-knowledge/backend/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: orion-knowledge/backend

      - name: Build
        run: go build ./...
        working-directory: orion-knowledge/backend

      - name: Vet
        run: go vet ./...
        working-directory: orion-knowledge/backend

  # ==================== Orion Knowledge Web (pnpm) ====================

  orion-knowledge-web-build:
    name: Orion Knowledge Web Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: orion-knowledge/web

      - name: Build
        run: pnpm build
        working-directory: orion-knowledge/web

  # ==================== Docker Multi-Arch Build (main only) ====================

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [go-test, frontend-test, api-gateway-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - orion-api-gateway
          - orion-frontend
          - orion-platform-svc-go
        include:
          - service: orion-api-gateway
            context: ./orion-api-gateway
            file: ./orion-api-gateway/Dockerfile
          - service: orion-frontend
            context: ./orion-frontend
            file: ./orion-frontend/Dockerfile
          - service: orion-platform-svc-go
            context: ./orion-platform-svc-go
            file: ./orion-platform-svc-go/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
