name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.25'

# ==================== Jobs ====================

jobs:
  # ==================== Lint (Fast check, runs first) ====================

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        service: [platform-service, api-gateway, frontend]
        include:
          - service: platform-service
            dir: orion-platform-service
          - service: api-gateway
            dir: orion-api-gateway
          - service: frontend
            dir: orion-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.dir }}

      - name: Lint
        run: npm run lint -- --max-warnings 0
        working-directory: ${{ matrix.dir }}

  # ==================== Type Check ====================

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [platform-service, api-gateway, frontend]
        include:
          - service: platform-service
            dir: orion-platform-service
          - service: api-gateway
            dir: orion-api-gateway
          - service: frontend
            dir: orion-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies (platform-service)
        if: ${{ matrix.service == 'platform-service' }}
        run: |
          npm ci
          cd packages/event-bus && npm ci && npm run build
        working-directory: orion-platform-service

      - name: Install dependencies
        if: ${{ matrix.service != 'platform-service' }}
        run: npm ci
        working-directory: ${{ matrix.dir }}

      - name: Type check
        run: npm run type-check
        working-directory: ${{ matrix.dir }}

  # ==================== Design Constraint Check ====================

  design-constraint:
    name: Design Constraint Check
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        working-directory: orion-frontend

      - name: Run Design Constraint AST Scan
        run: |
          npx tsx docs/design-constraints/framework/core/cli-check.ts \
            --scan orion-frontend/src/pages/ \
            --max-files 100 \
            --format json > design-constraint-results.json || true
          echo "=== Design Constraint Results ==="
          cat design-constraint-results.json | head -100
        working-directory: .

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-constraint-results
          path: design-constraint-results.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Design Constraint Check completed.';
            try {
              const results = JSON.parse(fs.readFileSync('design-constraint-results.json', 'utf8'));
              if (results.issues && results.issues.length > 0) {
                summary = `Found ${results.issues.length} design constraint issues.`;
              }
            } catch (e) {
              summary = 'Design Constraint Check completed (parse error).';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Design Constraint\n${summary}`
            });

  # ==================== Platform Service Unit Tests (No DB, Fast) ====================

  platform-service-unit-test:
    name: Platform Service Unit Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-platform-service/package-lock.json

      - name: Build local packages
        run: |
          cd packages/event-bus && npm ci && npm run build
        working-directory: orion-platform-service

      - name: Install dependencies
        run: npm ci
        working-directory: orion-platform-service

      - name: Run unit tests (no DB required)
        run: npx jest --testPathIgnorePatterns="integration" --silent --coverage --coverageReporters=text --coverageReporters=lcov --coverageThreshold='{"global":{"lines":80}}'
        working-directory: orion-platform-service

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: orion-platform-service/coverage/lcov.info
          retention-days: 30

      - name: Build
        run: npm run build
        working-directory: orion-platform-service

  # ==================== Platform Service Integration Tests (Requires PostgreSQL) ====================

  platform-service-integration-test:
    name: Platform Service Integration Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: orion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://orion:test_password_ci_only@localhost:5432/orion_test
      JWT_SECRET: test-secret-for-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-platform-service/package-lock.json

      - name: Build local packages
        run: |
          cd packages/event-bus && npm ci && npm run build
        working-directory: orion-platform-service

      - name: Install dependencies
        run: npm ci
        working-directory: orion-platform-service

      - name: Run migrations
        run: npx tsx src/db/run-migrations.ts
        working-directory: orion-platform-service

      - name: Run integration tests
        run: npx jest __tests__/integration/ --silent --coverage --coverageReporters=text --coverageReporters=lcov
        working-directory: orion-platform-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: orion
          DB_PASSWORD: test_password_ci_only
          DB_NAME: orion_test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-coverage
          path: orion-platform-service/coverage/lcov.info
          retention-days: 30

  # ==================== API Gateway Tests ====================

  api-gateway-test:
    name: API Gateway Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-api-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-api-gateway

      - name: Run tests
        run: npm run test:coverage
        working-directory: orion-api-gateway

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-coverage
          path: orion-api-gateway/coverage/lcov.info
          retention-days: 30

      - name: Build
        run: npm run build
        working-directory: orion-api-gateway

  # ==================== Frontend Tests ====================

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-frontend

      - name: Run tests
        run: npm run test -- --coverage --coverageThreshold='{"global":{"lines":60}}'
        working-directory: orion-frontend

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: orion-frontend/coverage/lcov.info
          retention-days: 30

      - name: Build
        run: npm run build
        working-directory: orion-frontend

  # ==================== Go Services ====================

  go-test:
    name: Go Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - orion-ticket-svc-go
          - orion-api-gateway-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: ${{ matrix.service }}

      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.service }}

      - name: Test
        run: go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
        working-directory: ${{ matrix.service }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.service }}-coverage
          path: ${{ matrix.service }}/coverage.out
          retention-days: 30

      - name: Build
        run: go build -o /dev/null ./...
        working-directory: ${{ matrix.service }}

  # ==================== Coverage Gate ====================

  coverage-gate:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: [platform-service-unit-test, platform-service-integration-test, frontend-test, api-gateway-test, go-test]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage'
          path: coverage/
          merge-multiple: false

      - name: Check backend coverage
        run: |
          if [ ! -f coverage/backend-coverage/lcov.info ]; then
            echo "Backend coverage file not found"
            exit 1
          fi
          echo "Backend coverage file found"

      - name: Check frontend coverage
        run: |
          if [ ! -f coverage/frontend-coverage/lcov.info ]; then
            echo "Frontend coverage file not found"
            exit 1
          fi
          echo "Frontend coverage file found"

      - name: Check Go service coverage
        run: |
          for svc in orion-ticket-svc-go orion-api-gateway-go; do
            if [ ! -f "coverage/go-${svc}-coverage/coverage.out" ]; then
              echo "Warning: Go coverage for $svc not found"
            else
              echo "Go coverage for $svc found"
            fi
          done

      - name: Generate coverage summary
        run: |
          echo "=== Coverage Summary ==="
          for dir in coverage/*/; do
            name=$(basename "$dir")
            echo "  $name: artifacts present"
          done

  # ==================== DB Migration Validation ====================

  db-migrations:
    name: DB Migration Check
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate SQL syntax (platform-service)
        run: |
          errors=0
          for f in orion-platform-service/src/db/migrations/*.sql; do
            echo "Checking $f..."
            if [ ! -s "$f" ]; then
              echo "Error: $f is empty"
              errors=$((errors + 1))
              continue
            fi
            if ! grep -qiE '(CREATE|ALTER|DROP|INSERT|SELECT|UPDATE|DELETE)' "$f"; then
              echo "Warning: $f may not contain valid SQL"
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors migration file(s) failed"
            exit 1
          fi
          echo "All migration files valid."

      - name: Check duplicate migration numbers
        run: |
          duplicates=$(ls orion-platform-service/src/db/migrations/*.sql | awk -F'/' '{print $NF}' | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Error: Duplicate migration numbers found: $duplicates"
            exit 1
          fi
          echo "No duplicate migration numbers."

  # ==================== Orion DB Client Tests ====================

  orion-db-test:
    name: Orion DB Client Tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        working-directory: orion-db

      - name: Check syntax
        run: node --check src/index.js
        working-directory: orion-db

  # ==================== Orion DBA Frontend Build ====================

  orion-dba-frontend-build:
    name: Orion DBA Frontend Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        working-directory: orion-dba/frontend

      - name: Build (with type check)
        run: npm run build
        working-directory: orion-dba/frontend

  # ==================== Orion AI Service (Python) ====================

  orion-ai-service-test:
    name: Orion AI Service Tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: orion-ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: orion-ai-service

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: orion-ai-service

  # ==================== Orion Knowledge Backend (Go) ====================

  orion-knowledge-backend-build:
    name: Orion Knowledge Backend Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: orion-knowledge/backend/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: orion-knowledge/backend

      - name: Build
        run: go build ./...
        working-directory: orion-knowledge/backend

      - name: Vet
        run: go vet ./...
        working-directory: orion-knowledge/backend

  # ==================== Orion Knowledge Web (pnpm) ====================

  orion-knowledge-web-build:
    name: Orion Knowledge Web Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: orion-knowledge/web

      - name: Build
        run: pnpm build
        working-directory: orion-knowledge/web

  # ==================== Orion Visor (Java/Maven) ====================

  orion-visor-build:
    name: Orion Visor Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Build with Maven
        run: mvn compile -DskipTests -B
        working-directory: orion-visor

      - name: Run tests
        run: mvn test -B
        working-directory: orion-visor

  # ==================== Docker Multi-Arch Build ====================

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [platform-service-unit-test, go-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - orion-platform-service
          - orion-api-gateway
          - orion-frontend
          - orion-ticket-svc-go
        include:
          - service: orion-platform-service
            context: ./orion-platform-service
            file: ./orion-platform-service/Dockerfile
          - service: orion-api-gateway
            context: ./orion-api-gateway
            file: ./orion-api-gateway/Dockerfile
          - service: orion-frontend
            context: ./orion-frontend
            file: ./orion-frontend/Dockerfile
          - service: orion-ticket-svc-go
            context: ./orion-ticket-svc-go
            file: ./orion-ticket-svc-go/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
