name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

# ==================== Path Filters ====================

# Only run platform-service jobs when relevant files change
jobs:
  # ==================== Lint (Fast check, runs first) ====================

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        service: [platform-service, api-gateway, frontend]
        include:
          - service: platform-service
            dir: orion-platform-service
            lockfile: orion-platform-service/package-lock.json
          - service: api-gateway
            dir: orion-api-gateway
            lockfile: orion-api-gateway/package-lock.json
          - service: frontend
            dir: orion-frontend
            lockfile: orion-frontend/package-lock.json
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.dir }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.dir }}

  # ==================== Type Check ====================

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [platform-service, api-gateway, frontend]
        include:
          - service: platform-service
            dir: orion-platform-service
          - service: api-gateway
            dir: orion-api-gateway
          - service: frontend
            dir: orion-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.dir }}

      - name: Type check
        run: npm run type-check
        working-directory: ${{ matrix.dir }}

  # ==================== Platform Service Tests ====================

  platform-service-test:
    name: Platform Service Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: orion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: orion-platform-service

      - name: Run tests
        run: npm run test:coverage
        working-directory: orion-platform-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: orion
          DB_PASSWORD: test_password_ci_only
          DB_NAME: orion_test

      - name: Build
        run: npm run build
        working-directory: orion-platform-service

  # ==================== API Gateway Tests ====================

  api-gateway-test:
    name: API Gateway Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: orion-api-gateway

      - name: Run tests
        run: npm run test:coverage
        working-directory: orion-api-gateway

      - name: Build
        run: npm run build
        working-directory: orion-api-gateway

  # ==================== Frontend Tests ====================

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: orion-frontend

      - name: Run tests
        run: npm run test:coverage
        working-directory: orion-frontend

      - name: Build
        run: npm run build
        working-directory: orion-frontend

  # ==================== DB Migration Validation ====================

  db-migrations:
    name: DB Migration Check
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate SQL syntax
        run: |
          errors=0
          for f in orion-platform-service/src/db/migrations/*.sql; do
            echo "Checking $f..."
            if [ ! -s "$f" ]; then
              echo "Error: $f is empty"
              errors=$((errors + 1))
              continue
            fi
            if ! grep -qiE '(CREATE|ALTER|DROP|INSERT|SELECT|UPDATE|DELETE)' "$f"; then
              echo "Warning: $f may not contain valid SQL"
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors migration file(s) failed"
            exit 1
          fi
          echo "All migration files valid."
