name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.25'

jobs:
  # ==================== Frontend Lint ====================

  lint:
    name: Lint & Format (frontend)
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-frontend

      - name: Lint — non-blocking
        run: npm run lint || echo "::warning::Lint found issues (see output). Not blocking CI."
        working-directory: orion-frontend

  # ==================== Frontend Type Check ====================

  type-check:
    name: Type Check (frontend)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-frontend

      - name: Type check — non-blocking
        run: npm run type-check || echo "::warning::Type check found issues (see output). Not blocking CI."
        working-directory: orion-frontend

  # ==================== Design Constraint Check ====================

  design-constraint:
    name: Design Constraint Check
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-frontend

      - name: Run Design Constraint AST Scan
        run: |
          npx --yes tsx docs/design-constraints/framework/core/cli-check.ts \
            --scan orion-frontend/src/pages/ \
            --max-files 100 \
            --format json > design-constraint-results.json || true
          echo "=== Design Constraint Results ==="
          cat design-constraint-results.json | head -100

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-constraint-results
          path: design-constraint-results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Design Constraint Check completed.';
            try {
              const results = JSON.parse(fs.readFileSync('design-constraint-results.json', 'utf8'));
              if (results.issues && results.issues.length > 0) {
                summary = `Found ${results.issues.length} design constraint issues.`;
              }
            } catch (e) {
              summary = 'Design Constraint Check completed (parse error).';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Design Constraint\n${summary}`
            });

  # ==================== Frontend Tests ====================

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-frontend

      - name: Run tests
        timeout-minutes: 20
        run: npm run test:coverage -- --run
        working-directory: orion-frontend

      - name: Coverage threshold check (vitest built-in)
        run: |
          echo "Coverage thresholds enforced by vitest built-in config (vite.config.ts)."
          echo "Current thresholds: branches=30, functions=35, lines=40, statements=40"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            orion-frontend/coverage/coverage-final.json
            orion-frontend/coverage/lcov.info
          retention-days: 30
          if-no-files-found: warn

      - name: Build
        run: npm run build
        working-directory: orion-frontend

  # ==================== Go Platform Service Tests ====================

  go-test:
    name: Go Test (orion-platform-svc-go)
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - orion-platform-svc-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: ${{ matrix.service }}

      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.service }}

      - name: Govulncheck — non-blocking
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck found vulnerabilities (see output). Not blocking CI."
        working-directory: ${{ matrix.service }}

      - name: Test
        run: go test ./... -v -race -timeout 10m -coverprofile=coverage.out -covermode=atomic
        working-directory: ${{ matrix.service }}

      - name: Coverage threshold check
        run: |
          total=$(go tool cover -func=coverage.out 2>/dev/null | grep total: | awk '{print $3}' | tr -d '%')
          echo "Go coverage: ${total}%"
          if [ -z "$total" ] || [ "$(echo "$total < 30" | bc)" -eq 1 ]; then
            echo "ERROR: Go coverage below 30% threshold (${total}%)"
            exit 1
          fi
        working-directory: ${{ matrix.service }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.service }}-coverage
          path: ${{ matrix.service }}/coverage.out
          retention-days: 30

      - name: Build
        run: go build -trimpath ./cmd/server
        working-directory: ${{ matrix.service }}

  # ==================== Go API Gateway Build ====================

  go-api-gateway-build:
    name: Go API Gateway Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build API Gateway (Go)
        run: go build -C orion-api-gateway-go ./cmd/server

      - name: Vet API Gateway (Go)
        run: go vet -C orion-api-gateway-go ./...

      - name: Test API Gateway (Go)
        run: go test -C orion-api-gateway-go ./... -count=1 -timeout 120s

      - name: Race Detect (Go)
        run: go test -C orion-api-gateway-go ./... -race -count=1 -timeout 180s

      - name: Coverage threshold check (Go)
        run: |
          go test -C orion-api-gateway-go ./... -coverprofile=coverage.out -covermode=atomic
          total=$(go tool cover -func=orion-api-gateway-go/coverage.out 2>/dev/null | grep total: | awk '{print $3}' | tr -d '%')
          echo "Go gateway coverage: ${total}%"
          if [ -z "$total" ] || [ "$(echo "$total < 35" | bc)" -eq 1 ]; then
            echo "ERROR: Go gateway coverage below 35% threshold (${total}%)"
            exit 1
          fi

      - name: Upload Go gateway coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-gateway-coverage
          path: orion-api-gateway-go/coverage.out
          retention-days: 30

      - name: Govulncheck (Go) — non-blocking
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... || echo "::warning::govulncheck found vulnerabilities (see output). Not blocking CI."
        working-directory: orion-api-gateway-go

      - name: GolangCI-Lint (Go) — non-blocking
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin || echo "::warning::golangci-lint install failed, skipping."
          $(go env GOPATH)/bin/golangci-lint run -C orion-api-gateway-go ./... 2>/dev/null || echo "::warning::golangci-lint found issues (see output). Not blocking CI."

  # ==================== Orion DBA Frontend Build ====================

  orion-dba-frontend-build:
    name: Orion DBA Frontend Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: orion-dba/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: orion-dba/frontend

      - name: Build (with type check) — non-blocking
        run: npm run build || echo "::warning::DBA frontend build found issues (see output). Not blocking CI."
        working-directory: orion-dba/frontend

  # ==================== Orion AI Service (Python) ====================

  orion-ai-service-test:
    name: Orion AI Service Tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: orion-ai-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install Pillow sentence-transformers 2>/dev/null || true
        working-directory: orion-ai-service

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: orion-ai-service

  # ==================== Orion Knowledge Backend (Go) ====================

  orion-knowledge-backend-build:
    name: Orion Knowledge Backend Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: orion-knowledge/backend/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: orion-knowledge/backend

      - name: Build
        run: go build ./...
        working-directory: orion-knowledge/backend

      - name: Vet
        run: go vet ./...
        working-directory: orion-knowledge/backend

  # ==================== Orion Knowledge Web (pnpm) ====================

  orion-knowledge-web-build:
    name: Orion Knowledge Web Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: orion-knowledge/web

      - name: Build
        run: pnpm build
        working-directory: orion-knowledge/web

  # ==================== Docker Multi-Arch Build (main only) ====================

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [go-test, frontend-test, go-api-gateway-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - orion-frontend
          - orion-platform-svc-go
          - orion-api-gateway-go
        include:
          - service: orion-frontend
            context: ./orion-frontend
            file: ./orion-frontend/Dockerfile
          - service: orion-platform-svc-go
            context: ./orion-platform-svc-go
            file: ./orion-platform-svc-go/Dockerfile
          - service: orion-api-gateway-go
            context: ./orion-api-gateway-go
            file: ./orion-api-gateway-go/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
