name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

# ==================== Path Filters ====================

# Only run platform-service jobs when relevant files change
jobs:
  # ==================== Lint (Fast check, runs first) ====================

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    strategy:
      matrix:
        service: [platform-service, api-gateway, frontend]
        include:
          - service: platform-service
            dir: orion-platform-service
          - service: api-gateway
            dir: orion-api-gateway
          - service: frontend
            dir: orion-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: ${{ matrix.dir }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.dir }}

  # ==================== Type Check ====================

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [platform-service, api-gateway, frontend]
        include:
          - service: platform-service
            dir: orion-platform-service
          - service: api-gateway
            dir: orion-api-gateway
          - service: frontend
            dir: orion-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (platform-service)
        if: ${{ matrix.service == 'platform-service' }}
        run: |
          npm install
          cd packages/event-bus && npm install && npm run build
        working-directory: orion-platform-service

      - name: Install dependencies
        if: ${{ matrix.service != 'platform-service' }}
        run: npm install
        working-directory: ${{ matrix.dir }}

      - name: Debug - Check build files (platform-service)
        if: ${{ matrix.service == 'platform-service' }}
        run: |
          echo "=== Checking build service files ==="
          ls -la src/services/build/ || echo "services/build not found"
          ls -la src/api/controllers/build/ || echo "controllers/build not found"
        working-directory: orion-platform-service

      - name: Type check
        run: npm run type-check
        working-directory: ${{ matrix.dir }}

  # ==================== Platform Service Tests ====================

  platform-service-test:
    name: Platform Service Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: orion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build local packages
        run: |
          cd packages/event-bus && npm install && npm run build
        working-directory: orion-platform-service

      - name: Install dependencies
        run: npm install
        working-directory: orion-platform-service

      - name: Run tests
        run: npm run test:coverage
        working-directory: orion-platform-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: orion
          DB_PASSWORD: test_password_ci_only
          DB_NAME: orion_test

      - name: Build
        run: npm run build
        working-directory: orion-platform-service

  # ==================== API Gateway Tests ====================

  api-gateway-test:
    name: API Gateway Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: orion-api-gateway

      - name: Run tests
        run: npm run test:coverage
        working-directory: orion-api-gateway

      - name: Build
        run: npm run build
        working-directory: orion-api-gateway

  # ==================== Frontend Tests ====================

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: type-check
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: orion-frontend

      - name: Run tests
        run: npm run test:coverage
        working-directory: orion-frontend

      - name: Build
        run: npm run build
        working-directory: orion-frontend

  # ==================== DB Migration Validation ====================

  db-migrations:
    name: DB Migration Check
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate SQL syntax
        run: |
          errors=0
          for f in orion-platform-service/src/db/migrations/*.sql; do
            echo "Checking $f..."
            if [ ! -s "$f" ]; then
              echo "Error: $f is empty"
              errors=$((errors + 1))
              continue
            fi
            if ! grep -qiE '(CREATE|ALTER|DROP|INSERT|SELECT|UPDATE|DELETE)' "$f"; then
              echo "Warning: $f may not contain valid SQL"
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors migration file(s) failed"
            exit 1
          fi
          echo "All migration files valid."

  # ==================== Orion DB Client Tests ====================

  orion-db-test:
    name: Orion DB Client Tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: orion-db

      - name: Check syntax
        run: node --check src/index.js
        working-directory: orion-db

  # ==================== Orion DBA Frontend Build ====================

  orion-dba-frontend-build:
    name: Orion DBA Frontend Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # DBA frontend requires Node 14+

      - name: Install dependencies
        run: npm install
        working-directory: orion-dba/frontend

      - name: Build (with type check)
        run: npm run build
        working-directory: orion-dba/frontend

  # ==================== Orion Knowledge Backend (Go) ====================

  orion-knowledge-backend-build:
    name: Orion Knowledge Backend Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download
        working-directory: orion-knowledge/backend

      - name: Build
        run: go build ./...
        working-directory: orion-knowledge/backend

      - name: Vet
        run: go vet ./...
        working-directory: orion-knowledge/backend

  # ==================== Orion Knowledge Web (pnpm) ====================

  orion-knowledge-web-build:
    name: Orion Knowledge Web Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: orion-knowledge/web

      - name: Build
        run: pnpm build
        working-directory: orion-knowledge/web

  # ==================== Orion Visor (Java/Maven) ====================
  # Note: orion-visor is from gitee.com/dromara/orion-visor.git but exists in this repo

  orion-visor-build:
    name: Orion Visor Build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Build with Maven
        run: mvn compile -DskipTests -B
        working-directory: orion-visor

      - name: Run tests
        run: mvn test -B
        working-directory: orion-visor
