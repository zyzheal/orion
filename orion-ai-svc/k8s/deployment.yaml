apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-ai-svc
  namespace: orion
  labels:
    app: orion-ai-svc
    component: ai-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-ai-svc
  template:
    metadata:
      labels:
        app: orion-ai-svc
        component: ai-service
        version: v1
    spec:
      serviceAccountName: orion-ai-svc
      containers:
        - name: orion-ai-svc
          image: orion-ai-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3012
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3012"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orion-secrets
                  key: database-url
                  optional: true
            - name: AI_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orion-secrets
                  key: ai-llm-api-key
                  optional: true
            - name: AI_LLM_PROVIDER
              value: "anthropic"
            - name: AI_LLM_MODEL
              value: "claude-sonnet-4-6-20250514"
            - name: LOG_LEVEL
              value: "info"
            - name: CORS_ORIGIN
              value: "https://orion.example.com"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3012
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3012
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - orion-ai-svc
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ai"
          effect: "NoSchedule"