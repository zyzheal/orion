apiVersion: v1
kind: Service
metadata:
  name: orion-finops-svc
  namespace: orion
  labels:
    app: orion-finops-svc
    component: finops-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3009
      protocol: TCP
  selector:
    app: orion-finops-svc
---
apiVersion: v1
kind: Service
metadata:
  name: orion-finops-svc-nodeport
  namespace: orion
  labels:
    app: orion-finops-svc
    component: finops-service
spec:
  type: NodePort
  ports:
    - name: http
      port: 3009
      targetPort: 3009
      nodePort: 30090
      protocol: TCP
  selector:
    app: orion-finops-svc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-finops-svc-hpa
  namespace: orion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-finops-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max