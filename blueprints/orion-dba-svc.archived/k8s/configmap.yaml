apiVersion: v1
kind: ConfigMap
metadata:
  name: orion-dba-config
  namespace: orion
  labels:
    app: orion-dba
data:
  # Yearning backend URL (SQL audit engine)
  yearning-url: "http://yearning:8080"
  # CORS origins (comma-separated)
  cors-origin: "http://localhost:5173,http://localhost:3000,http://orion-web:80"
  # Platform service URL for callbacks
  platform-service-url: "http://orion-platform-svc:80"