version: "3.8"

services:
  skill-svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orion-skill-svc
    ports:
      - "3021:3021"
    environment:
      - PORT=3021
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgresql://orion:orion_password@postgres:5432/orion_skills
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=orion_skills
      - DB_USER=orion
      - DB_PASSWORD=orion_password
      - DB_SSL=false
      - DB_POOL_MIN=2
      - DB_POOL_MAX=20
      - CORS_ORIGIN=*
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW=60000
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orion-network

  postgres:
    image: postgres:16-alpine
    container_name: orion-skills-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion_password
      - POSTGRES_DB=orion_skills
    volumes:
      - skill-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion_skills"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - orion-network

volumes:
  skill-db-data:

networks:
  orion-network:
    driver: bridge
