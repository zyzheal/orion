services:
  orion-monitor-svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orion-monitor-svc
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=development
      - PORT=3100
      - REDIS_URL=redis://redis:6379
      - TICKET_SVC_URL=http://orion-ticket-svc:3000
      - PLATFORM_CORE_URL=http://orion-platform-core:3000
    depends_on:
      - redis
    volumes:
      - ./src:/app/src
    command: ["npm", "run", "dev"]

  redis:
    image: redis:7-alpine
    container_name: orion-monitor-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
