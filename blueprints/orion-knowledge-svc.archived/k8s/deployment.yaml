apiVersion: v1
kind: Service
metadata:
  name: orion-knowledge-svc
  namespace: orion
  labels:
    app: orion-knowledge-svc
    component: knowledge-service
spec:
  type: ClusterIP
  ports:
    - name: http
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      port: 80
      targetPort: 3020
      protocol: TCP
  selector:
    app: orion-knowledge-svc
