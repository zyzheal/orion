apiVersion: v1
kind: Service
metadata:
  name: orion-ai-svc
  namespace: orion
  labels:
    app: orion-ai-svc
    component: ai-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3012
      protocol: TCP
      name: http
  selector:
    app: orion-ai-svc

---
apiVersion: v1
kind: Service
metadata:
  name: orion-ai-svc-headless
  namespace: orion
  labels:
    app: orion-ai-svc
    component: ai-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 3012
      targetPort: 3012
      protocol: TCP
      name: http
  selector:
    app: orion-ai-svc

---
apiVersion: v1
kind: Service
metadata:
  name: orion-ai-svc-lb
  namespace: orion
  labels:
    app: orion-ai-svc
    component: ai-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3012
      protocol: TCP
      name: http
  selector:
    app: orion-ai-svc