apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-security-svc
  namespace: orion
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orion-security-svc
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orion-security-svc-binding
roleRef:
  kind: Role
  name: orion-security-svc
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: orion-security-svc
    namespace: orion