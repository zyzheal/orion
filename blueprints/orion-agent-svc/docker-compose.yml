services:
  orion-agent-svc:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3100:3100"
    volumes:
      # Docker socket for sandbox container execution
      - /var/run/docker.sock:/var/run/docker.sock
      # Sandbox workspace
      - sandbox-data:/tmp/sandbox
    environment:
      - NODE_ENV=development
      - PORT=3100
      - REDIS_URL=redis://redis:6379
      - SANDBOX_IMAGE=alpine:3.20
      - SANDBOX_TIMEOUT=300
      - SANDBOX_MEMORY_LIMIT=512m
      - SANDBOX_CPU_LIMIT=1.0
      - HEARTBEAT_INTERVAL=15
      - HEARTBEAT_DEAD_THRESHOLD=60
      - HEARTBEAT_STALE_THRESHOLD=30
      - MAX_RUNNERS=10
      - SCALING_COOLDOWN=60
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
  sandbox-data:
