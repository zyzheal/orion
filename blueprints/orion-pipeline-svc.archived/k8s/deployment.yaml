apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-pipeline-svc
  namespace: orion
  labels:
    app: orion-pipeline
    version: v1
    component: pipeline-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-pipeline
  template:
    metadata:
      labels:
        app: orion-pipeline
        version: v1
        component: pipeline-service
    spec:
      containers:
        - name: pipeline
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: orion-pipeline-svc:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
            - name: HOST
              value: "0.0.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orion-pipeline-secrets
                  key: database-url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: orion-pipeline-config
                  key: redis-url
                  optional: true
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: orion-pipeline-config
                  key: nats-url
                  optional: true
            - name: PLATFORM_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: orion-pipeline-config
                  key: platform-service-url
                  optional: true
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: orion-pipeline
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "node-type"
          operator: "Equal"
          value: "general"
          effect: "NoSchedule"
