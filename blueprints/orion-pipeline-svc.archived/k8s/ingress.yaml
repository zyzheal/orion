# Ingress configuration for external access
# Supports TLS termination, path-based routing, and annotations for nginx ingress controller

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orion-pipeline-svc-ingress
  namespace: orion
  labels:
    app: orion-pipeline
    component: pipeline-service
  annotations:
    # Nginx ingress controller annotations
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # SSE support for pipeline logs
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/x-accel-buffering: "off"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  # TLS configuration (uncomment when cert-manager is set up)
  # tls:
  #   - hosts:
  #       - pipeline.orion.internal
  #     secretName: orion-pipeline-tls
  rules:
    - host: pipeline.orion.internal
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: orion-pipeline-svc
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: orion-pipeline-svc
                port:
                  name: http
    # SSE endpoint for real-time logs
    - host: logs.orion.internal
      http:
        paths:
          - path: /api/v1/pipelines/:id/logs
            pathType: Prefix
            backend:
              service:
                name: orion-pipeline-svc
                port:
                  name: http
