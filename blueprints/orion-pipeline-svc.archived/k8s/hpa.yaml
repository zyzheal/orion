# Horizontal Pod Autoscaler
# Auto-scales based on CPU, memory, and custom metrics
# Reference: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-pipeline-svc-hpa
  namespace: orion
  labels:
    app: orion-pipeline
    component: pipeline-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-pipeline-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  # Scaling behavior configuration
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
        - type: Percent
          value: 10
          periodSeconds: 120
