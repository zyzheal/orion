# ============================================================
# Orion CMDB Collector — 采集器配置 (YAML)
# ============================================================
#
# 使用方式:
#   1. 采集任务配置: 每行一个采集目标
#   2. 调度器读取此文件，按 schedule 执行采集
#   3. CollectorFactory 按 collector 字段查找对应适配器
#
# 参考: NeatLogic CMDB 采集 (本地 44 + 远程 82 适配器)

# 采集器配置
collectors:
  # ============================================================
  # 网络设备采集 (SNMP/SSH)
  # ============================================================
  - name: cisco-core-01
    collector: cisco_ios       # 对应 CiscoCollector.Name()
    type: network              # 设备类型
    vendor: cisco              # 厂商
    schedule: "0 */6 * * *"    # 每 6 小时采集一次
    timeout: 30                # 采集超时 (秒)
    retries: 2                 # 重试次数

    # SNMP 配置
    target:
      host: "192.168.1.1"
      port: 161
      community: "public"
      version: 2               # 1=SNMPv1, 2=SNMPv2c, 3=SNMPv3

    # SSH 配置 (可选)
    ssh:
      host: "192.168.1.1"
      port: 22
      username: "admin"
      password: "${CISCO_SSH_PASSWORD}"  # 使用环境变量
      cli_mode: cisco_ios
      timeout: 60
      enable_cmd: "enable"
      enable_pass: "${CISCO_ENABLE_PASS}"

    # 采集范围
    scopes:
      - system          # 系统信息
      - interface       # 接口信息
      - neighbor        # 邻居关系 (CDP/LLDP)
      - cpu             # CPU 使用率
      - memory          # 内存使用率
      - environment     # 温度/电源

    tags:
      environment: prod
      site: beijing
      rack: r1
      description: "核心交换机"

  - name: huawei-core-01
    collector: huawei_vrp
    type: network
    vendor: huawei
    schedule: "0 */6 * * *"
    timeout: 30
    retries: 2

    target:
      host: "192.168.1.2"
      port: 161
      community: "huawei_public"
      version: 2

    ssh:
      host: "192.168.1.2"
      port: 22
      username: "admin"
      password: "${HUAWEI_SSH_PASSWORD}"
      cli_mode: huawei_vrp
      timeout: 60

    scopes:
      - system
      - interface
      - neighbor
      - cpu
      - memory

    tags:
      environment: prod
      site: beijing
      rack: r2
      description: "汇聚交换机"

  - name: h3c-access-01
    collector: h3c_comware
    type: network
    vendor: h3c
    schedule: "0 */12 * * *"
    timeout: 30
    retries: 2

    target:
      host: "192.168.1.100"
      port: 161
      community: "h3c_public"
      version: 2

    ssh:
      host: "192.168.1.100"
      port: 22
      username: "admin"
      password: "${H3C_SSH_PASSWORD}"
      cli_mode: h3c_comware
      timeout: 60

    scopes:
      - system
      - interface

    tags:
      environment: prod
      site: shanghai
      description: "接入交换机"

  # ============================================================
  # 数据库采集 (连接池/SQL)
  # ============================================================
  - name: mysql-prod-01
    collector: mysql
    type: database
    vendor: mysql
    schedule: "0 */2 * * *"   # 每 2 小时采集一次
    timeout: 60               # 数据库查询超时
    retries: 3

    target:
      host: "192.168.1.10"
      port: 3306
      username: "cmdb_reader"
      password: "${MYSQL_CMDB_PASSWORD}"
      database: "information_schema"
      charset: utf8mb4

    # 连接池配置
    pool:
      max_open_conns: 5
      max_idle_conns: 2
      conn_max_lifetime: 300
      conn_max_idle_time: 60

    scopes:
      - version
      - databases
      - tables
      - users
      - status

    tags:
      environment: prod
      description: "主数据库"

  - name: postgresql-prod-01
    collector: postgresql
    type: database
    vendor: postgresql
    schedule: "0 */2 * * *"
    timeout: 60
    retries: 3

    target:
      host: "192.168.1.11"
      port: 5432
      username: "cmdb_reader"
      password: "${POSTGRESQL_CMDB_PASSWORD}"
      database: "postgres"

    pool:
      max_open_conns: 5
      max_idle_conns: 2
      conn_max_lifetime: 300
      conn_max_idle_time: 60

    scopes:
      - version
      - databases
      - schemas
      - tables
      - users
      - connections

    tags:
      environment: prod
      description: "PostgreSQL 主库"

  - name: oracle-prod-01
    collector: oracle
    type: database
    vendor: oracle
    schedule: "0 */4 * * *"
    timeout: 60
    retries: 3

    target:
      host: "192.168.1.12"
      port: 1521
      username: "cmdb_reader"
      password: "${ORACLE_CMDB_PASSWORD}"
      service_name: ORCL    # Oracle service name

    pool:
      max_open_conns: 5
      max_idle_conns: 2
      conn_max_lifetime: 300
      conn_max_idle_time: 60

    scopes:
      - version
      - tablespaces
      - tables
      - system_parameters

    tags:
      environment: prod
      description: "Oracle 主库"

# ============================================================
# 全局配置
# ============================================================
global:
  # 租户隔离
  tenant_id: "default"

  # 采集超时
  default_timeout: 30

  # 重试策略
  default_retries: 3
  retry_delay: 2

  # 并发控制
  max_parallel: 10        # 最大并发采集数

  # 结果处理
  batch_size: 100         # 批量入库大小
  dedup_key: "attributes.vendor"  # 去重字段

  # 日志
  log_level: "info"
  log_format: "json"

