services:
  orion-notify-svc:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3026:3026"
    environment:
      - NODE_ENV=development
      - PORT=3026
      - DATABASE_URL=postgresql://orion:orion_secret@orion-db:5432/orion_notify
      - LOG_LEVEL=info
    depends_on:
      orion-db:
        condition: service_healthy
    restart: unless-stopped

  orion-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion_secret
      - POSTGRES_DB=orion_notify
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
