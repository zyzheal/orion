apiVersion: v1
kind: Service
metadata:
  name: orion-dr-svc
  namespace: orion
  labels:
    app: orion-dr
    component: disaster-recovery-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3016
      protocol: TCP
      name: http
  selector:
    app: orion-dr
---
apiVersion: v1
kind: Service
metadata:
  name: orion-dr-svc-headless
  namespace: orion
  labels:
    app: orion-dr
    component: disaster-recovery-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 3016
      targetPort: 3016
      protocol: TCP
      name: http
  selector:
    app: orion-dr