version: '3.8'

services:
  # Patroni - 高可用管理
  patroni-master:
    image: zalando/patroni:latest
    container_name: orion-patroni-master
    environment:
      PATRONI_NAME: pg-master
      PATRONI_SCOPE: orion-cluster
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_USERNAME: patroni
      PATRONI_RESTAPI_PASSWORD: patroni_password
      PATRONI_POSTGRESQL_USERNAME: postgres
      PATRONI_POSTGRESQL_PASSWORD: postgres_password
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replicator_password
      ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
    ports:
      - "5432:5432"
      - "8008:8008"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./config/patroni.yml:/etc/patroni/patroni.yml:ro
    networks:
      - orion-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - etcd1
      - etcd2
      - etcd3

  patroni-replica1:
    image: zalando/patroni:latest
    container_name: orion-patroni-replica1
    environment:
      PATRONI_NAME: pg-replica1
      PATRONI_SCOPE: orion-cluster
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_USERNAME: patroni
      PATRONI_RESTAPI_PASSWORD: patroni_password
      PATRONI_POSTGRESQL_USERNAME: postgres
      PATRONI_POSTGRESQL_PASSWORD: postgres_password
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replicator_password
      ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica1_data:/var/lib/postgresql/data
      - ./config/patroni.yml:/etc/patroni/patroni.yml:ro
    networks:
      - orion-db-network
    depends_on:
      - patroni-master

  patroni-replica2:
    image: zalando/patroni:latest
    container_name: orion-patroni-replica2
    environment:
      PATRONI_NAME: pg-replica2
      PATRONI_SCOPE: orion-cluster
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_USERNAME: patroni
      PATRONI_RESTAPI_PASSWORD: patroni_password
      PATRONI_POSTGRESQL_USERNAME: postgres
      PATRONI_POSTGRESQL_PASSWORD: postgres_password
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replicator_password
      ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
    ports:
      - "5434:5432"
    volumes:
      - postgres_replica2_data:/var/lib/postgresql/data
      - ./config/patroni.yml:/etc/patroni/patroni.yml:ro
    networks:
      - orion-db-network
    depends_on:
      - patroni-master

  # PgBouncer - 连接池
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: orion-pgbouncer
    environment:
      POSTGRESQL_HOST: patroni-master
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres_password
      PGBOUNCER_DATABASE: "*"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_IGNORE_DATABASE: postgres
      PGBOUNCER_ADMIN_USERS: postgres
      PGBOUNCER_AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    networks:
      - orion-db-network
    depends_on:
      - patroni-master

  # Etcd 集群 - 分布式键值存储（Patroni DCS）
  etcd1:
    image: quay.io/coreos/etcd:latest
    container_name: orion-etcd1
    environment:
      ETCD_NAME: etcd1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - orion-db-network

  etcd2:
    image: quay.io/coreos/etcd:latest
    container_name: orion-etcd2
    environment:
      ETCD_NAME: etcd2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ports:
      - "2381:2379"
      - "2382:2380"
    networks:
      - orion-db-network

  etcd3:
    image: quay.io/coreos/etcd:latest
    container_name: orion-etcd3
    environment:
      ETCD_NAME: etcd3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ports:
      - "2383:2379"
      - "2384:2380"
    networks:
      - orion-db-network

networks:
  orion-db-network:
    driver: bridge

volumes:
  postgres_master_data:
  postgres_replica1_data:
  postgres_replica2_data:
