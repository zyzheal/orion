version: '3.8'

services:
  finops-svc:
    build: .
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://orion:orion123@postgres:5432/finops_db
    depends_on:
      - postgres
    networks:
      - orion-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=finops_db
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion123
    ports:
      - "5432:5432"
    volumes:
      - finops-svc-data:/var/lib/postgresql/data
    networks:
      - orion-network

networks:
  orion-network:
    driver: bridge

volumes:
  finops-svc-data:
