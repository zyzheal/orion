version: '3.8'
services:
  approval:
    build: .
    ports:
      - "3023:3023"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://orion:orion123@postgres:5432/approval_db
    depends_on:
      - postgres
    networks:
      - orion-network
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=approval_db
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion123
    ports:
      - "5432:5432"
    volumes:
      - approval-data:/var/lib/postgresql/data
    networks:
      - orion-network
networks:
  orion-network:
    driver: bridge
volumes:
  approval-data:
