apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-runner-svc
  namespace: orion
  labels:
    app: orion-runner-svc
    version: v1
    component: runner-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orion-runner-svc
  template:
    metadata:
      labels:
        app: orion-runner-svc
        version: v1
        component: runner-service
    spec:
      containers:
        - name: runner-svc
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: orion-runner-svc:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3028
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3028"
            - name: HOST
              value: "0.0.0.0"
            - name: PLATFORM_URL
              value: "http://orion-platform-svc:3001"
            - name: PLATFORM_TIMEOUT
              value: "30000"
            - name: RUNNER_NAME
              value: ""
            - name: RUNNER_LABELS
              value: "linux,nodejs"
            - name: RUNNER_MAX_CONCURRENT
              value: "5"
            - name: HEARTBEAT_INTERVAL
              value: "30000"
            - name: RUNNER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orion-runner-secrets
                  key: RUNNER_API_TOKEN
            - name: TENANT_ID
              value: "default"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /runner/health
              port: 3028
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /runner/health
              port: 3028
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
