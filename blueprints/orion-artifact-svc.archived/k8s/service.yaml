apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-artifact-svc
  namespace: orion
  labels:
    app: orion-artifact-svc
    version: v1
    component: artifact-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-artifact-svc
  template:
    metadata:
      labels:
        app: orion-artifact-svc
        version: v1
        component: artifact-service
    spec:
      containers:
        - name: artifact-svc
          image: orion-artifact-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3014
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3014"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: orion-artifact-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: orion-artifact-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: orion-artifact-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orion-artifact-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orion-artifact-secrets
                  key: DB_PASSWORD
            - name: DB_POOL_SIZE
              value: "10"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: orion-artifact-config
                  key: LOG_LEVEL
            - name: STORAGE_PATH
              valueFrom:
                configMapKeyRef:
                  name: orion-artifact-config
                  key: STORAGE_PATH
            - name: STORAGE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: orion-artifact-config
                  key: STORAGE_TYPE
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: orion-artifact-config
                  key: CORS_ORIGIN
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: artifact-storage
              mountPath: /var/lib/artifacts
          livenessProbe:
            httpGet:
              path: /health
              port: 3014
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3014
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
      volumes:
        - name: artifact-storage
          emptyDir: {}