version: '3.8'

services:
  knowledge-svc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3020:3020"
    environment:
      - NODE_ENV=development
      - PORT=3020
      - DATABASE_URL=${DATABASE_URL:-postgresql://orion:orion@postgres:5432/orion_knowledge}
      - NATS_SERVERS=${NATS_SERVERS:-nats://nats:4222}
      - EVENT_BUS_ENABLED=${EVENT_BUS_ENABLED:-false}
      - VECTOR_DIMENSION=1536
      - VECTOR_DISTANCE_METRIC=cosine
      - RAG_TOP_K=5
      - RAG_SCORE_THRESHOLD=0.7
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orion-net
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion
      - POSTGRES_DB=orion_knowledge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion_knowledge"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orion-net

networks:
  orion-net:
    driver: bridge

volumes:
  pgdata:
