apiVersion: v1
kind: Service
metadata:
  name: orion-selfhealing-svc
  namespace: orion
  labels:
    app: orion-selfhealing-svc
    component: self-healing
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: orion-selfhealing-svc
---
apiVersion: v1
kind: Service
metadata:
  name: orion-selfhealing-svc-nodeport
  namespace: orion
  labels:
    app: orion-selfhealing-svc
    component: self-healing
    tier: backend
spec:
  type: NodePort
  ports:
    - name: http
      port: 3002
      targetPort: http
      nodePort: 30062
      protocol: TCP
  selector:
    app: orion-selfhealing-svc