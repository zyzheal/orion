apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-monitor-svc
  namespace: orion
  labels:
    app: orion-monitor-svc
    version: v1
    component: monitor-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-monitor-svc
  template:
    metadata:
      labels:
        app: orion-monitor-svc
        version: v1
        component: monitor-service
    spec:
      containers:
        - name: monitor-svc
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: orion-monitor-svc:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orion-monitor-secrets
                  key: DATABASE_URL
            - name: DB_MAX_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: orion-monitor-config
                  key: DB_MAX_CONNECTIONS
            - name: DB_SSL_REJECT_UNAUTHORIZED
              valueFrom:
                configMapKeyRef:
                  name: orion-monitor-config
                  key: DB_SSL_REJECT_UNAUTHORIZED
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: orion-monitor-config
                  key: LOG_LEVEL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: orion-monitor-config
                  key: CORS_ORIGIN
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
