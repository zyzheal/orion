apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orion-chatops-svc-ingress
  namespace: orion
  labels:
    app: orion-chatops
    component: chatops-service
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: chatops.orion.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orion-chatops-svc
                port:
                  number: 80
  tls:
    - hosts:
        - chatops.orion.example.com
      secretName: orion-chatops-tls-secret