apiVersion: v1
kind: Service
metadata:
  name: orion-pipeline-svc
  namespace: orion
  labels:
    app: orion-pipeline
    component: pipeline-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3002
      protocol: TCP
      name: http
  selector:
    app: orion-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: orion-pipeline-svc-headless
  namespace: orion
  labels:
    app: orion-pipeline
    component: pipeline-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
      name: http
  selector:
    app: orion-pipeline