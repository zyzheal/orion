version: "3.8"

services:
  pipeline-svc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=development
      - PORT=3100
      - REDIS_URL=redis://redis:6379
      - PLATFORM_CORE_URL=http://platform-core:3000
      - AGENT_SVC_URL=http://agent-svc:3200
      - GATEWAY_URL=http://gateway:8080
      - LOG_LEVEL=debug
    depends_on:
      - redis
    volumes:
      - ./src:/app/src
    command: ["npx", "tsx", "watch", "src/app.ts"]

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  # Optional: platform-core local mock for development
  platform-core:
    image: node:20-slim
    profiles:
      - full-stack
    # TODO: Replace with actual platform-core image
    ports:
      - "3000:3000"

  # Optional: agent-svc local mock for development
  agent-svc:
    image: node:20-slim
    profiles:
      - full-stack
    # TODO: Replace with actual agent-svc image
    ports:
      - "3200:3200"

volumes:
  redis-data:
