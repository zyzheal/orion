apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-graph-svc
  namespace: orion
  labels:
    app: orion-graph-svc
    version: v1
    component: graph-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-graph-svc
  template:
    metadata:
      labels:
        app: orion-graph-svc
        version: v1
        component: graph-service
    spec:
      containers:
        - name: graph-svc
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: orion-graph-svc:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3035
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3035"
            - name: HOST
              value: "0.0.0.0"
            - name: NEO4J_URI
              valueFrom:
                configMapKeyRef:
                  name: orion-graph-config
                  key: NEO4J_URI
            - name: NEO4J_USER
              valueFrom:
                configMapKeyRef:
                  key: NEO4J_USER
                  name: orion-graph-config
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orion-graph-secrets
                  key: NEO4J_PASSWORD
            - name: NEO4J_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: orion-graph-config
                  key: NEO4J_DATABASE
            - name: NATS_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: orion-graph-config
                  key: NATS_SERVERS
            - name: LOG_LEVEL
              value: "info"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: orion-graph-config
                  key: CORS_ORIGIN
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3035
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3035
            initialDelaySeconds: 10
            periodSeconds: 5
              timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
