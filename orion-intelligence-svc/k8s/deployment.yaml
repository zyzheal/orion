apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-intelligence-svc
  namespace: orion
  labels:
    app: orion-intelligence-svc
    version: v1
    component: intelligence-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-intelligence-svc
  template:
    metadata:
      labels:
        app: orion-intelligence-svc
        version: v1
        component: intelligence-service
    spec:
      containers:
        - name: intelligence-svc
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: orion-intelligence-svc:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "8000"
            - name: LOG_LEVEL
              value: "info"
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orion-intelligence-secrets
                  key: DATABASE_URL
            # ClickHouse
            - name: CLICKHOUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: orion-intelligence-config
                  key: CLICKHOUSE_HOST
            - name: CLICKHOUSE_PORT
              valueFrom:
                configMapKeyRef:
                  name: orion-intelligence-config
                  key: CLICKHOUSE_PORT
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: orion-intelligence-config
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orion-intelligence-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DB
              valueFrom:
                configMapKeyRef:
                  name: orion-intelligence-config
                  key: CLICKHOUSE_DB
            # Redis
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: orion-intelligence-config
                  key: REDIS_URL
            # LLM
            - name: LLM_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: orion-intelligence-config
                  key: LLM_API_BASE
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orion-intelligence-secrets
                  key: LLM_API_KEY
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: orion-intelligence-config
                  key: LLM_MODEL
            # Knowledge Service
            - name: KNOWLEDGE_SVC_URL
              valueFrom:
                configMapKeyRef:
                  name: orion-intelligence-config
                  key: KNOWLEDGE_SVC_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
