apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-chatops-svc
  namespace: orion
  labels:
    app: orion-chatops
    version: v1
    component: chatops-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-chatops
  template:
    metadata:
      labels:
        app: orion-chatops
        version: v1
        component: chatops-service
    spec:
      containers:
        - name: chatops
          image: orion-chatops-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3022
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3022"
            - name: HOST
              value: "0.0.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orion-chatops-secrets
                  key: database-url
                  optional: true
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: orion-chatops-config
                  key: nats-url
                  optional: true
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3022
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3022
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: orion-chatops
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "node-type"
          operator: "Equal"
          value: "general"
          effect: "NoSchedule"