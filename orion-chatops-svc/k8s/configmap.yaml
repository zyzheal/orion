apiVersion: v1
kind: ConfigMap
metadata:
  name: orion-chatops-config
  namespace: orion
  labels:
    app: orion-chatops
    component: chatops-service
data:
  nats-url: "nats://nats-cluster:4222"
  log-level: "info"
  cors-origin: "https://orion.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: orion-chatops-secrets
  namespace: orion
  labels:
    app: orion-chatops
    component: chatops-service
type: Opaque
stringData:
  database-url: "postgresql://orion:orion123@postgres.orion:5432/chatops_db"
  nats-credentials: ""
  jwt-secret: "your-jwt-secret-change-in-production"