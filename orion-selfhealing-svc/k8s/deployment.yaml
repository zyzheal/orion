apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-selfhealing-svc
  namespace: orion
  labels:
    app: orion-selfhealing-svc
    component: self-healing
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-selfhealing-svc
  template:
    metadata:
      labels:
        app: orion-selfhealing-svc
        component: self-healing
        tier: backend
    spec:
      containers:
        - name: orion-selfhealing-svc
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: orion-selfhealing-svc:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orion-selfhealing-secrets
                  key: url
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: orion-selfhealing-svc
                topologyKey: kubernetes.io/hostname
