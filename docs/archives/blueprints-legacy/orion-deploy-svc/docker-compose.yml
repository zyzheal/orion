version: "3.8"

services:
  deploy-svc:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./src:/app/src:delegated
    depends_on:
      - redis
      - postgres
    networks:
      - orion-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - orion-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion_dev_pass
      POSTGRES_DB: orion_deploy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - orion-network

volumes:
  redis-data:
  postgres-data:

networks:
  orion-network:
    driver: bridge
