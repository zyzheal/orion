apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-community-svc
  namespace: orion
  labels:
    app: orion-community
    version: v1
    component: community-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-community
  template:
    metadata:
      labels:
        app: orion-community
        version: v1
        component: community-service
    spec:
      containers:
        - name: community
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: orion-community-svc:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3029
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3029"
            - name: HOST
              value: "0.0.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orion-community-secrets
                  key: database-url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: orion-community-config
                  key: redis-url
                  optional: true
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: orion-community-config
                  key: nats-url
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orion-community-secrets
                  key: jwt-secret
                  optional: true
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3029
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3029
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: orion-community
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "node-type"
          operator: "Equal"
          value: "general"
          effect: "NoSchedule"
