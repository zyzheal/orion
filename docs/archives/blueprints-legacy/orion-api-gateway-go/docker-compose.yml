version: "3.8"

services:
  api-gateway:
    build: .
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=change-me-in-production
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_NAME=orion-api-gateway
      - ENVIRONMENT=development
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orion

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orion

networks:
  orion:
    driver: bridge
