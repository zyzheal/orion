apiVersion: v1
kind: Service
metadata:
  name: orion-ticket-svc
  namespace: orion
  labels:
    app: orion-ticket-svc
    version: v1
    component: ticket-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3004
      protocol: TCP
      name: http
  selector:
    app: orion-ticket-svc
---
apiVersion: v1
kind: Service
metadata:
  name: orion-ticket-svc-headless
  namespace: orion
  labels:
    app: orion-ticket-svc
    version: v1
    component: ticket-service
spec:
  clusterIP: None
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
      name: http
  selector:
    app: orion-ticket-svc