# NATS Server 1 配置
# Orion Platform - NATS JetStream Cluster

server_name: nats-1
port: 4222
http_port: 8222

# ============================================================
# JetStream 配置
# ============================================================
jetstream {
  max_mem_store: 1GB
  max_file_store: 10GB
  store_dir: /data
}

# ============================================================
# Cluster 配置
# ============================================================
cluster {
  name: ORION
  listen: 0.0.0.0:6222
  routes = [
    nats://nats-2:6222
    nats://nats-3:6222
  ]
}

