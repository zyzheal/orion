# NATS Server 2 配置
# Orion Platform - NATS JetStream Cluster

server_name: nats-2
port: 4222
http_port: 8222

jetstream {
  max_mem_store: 1GB
  max_file_store: 10GB
  store_dir: /data
}

cluster {
  name: ORION
  listen: 0.0.0.0:6222
  routes = [
    nats://nats-1:6222
    nats://nats-3:6222
  ]
}

logtime: true
debug: false
trace: false
log_file: /var/log/nats/nats.log
