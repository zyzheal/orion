[package]
name = "orion-plugin-sdk"
version = "1.0.0"
description = "Orion Plugin SDK for Python - Build custom task plugins for Orion Pipeline"
author = "Orion Team"
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/orion-design/orion-platform-service"
Documentation = "https://github.com/orion-design/orion-platform-service/tree/main/sdk/python"

[dependencies]
# No external dependencies required for basic SDK functionality

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orion_plugin_sdk*"]
