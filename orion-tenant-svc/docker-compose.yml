version: "3.8"
services:
  tenant-svc:
    build: .
    ports:
      - "8083:8083"
    environment:
      - DATABASE_URL=postgres://orion:orion@postgres:5432/orion_tenant?sslmode=disable
      - JWT_SECRET=change-me-in-production
      - SERVICE_NAME=orion-tenant-svc
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orion
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=orion
      - POSTGRES_PASSWORD=orion
      - POSTGRES_DB=orion_tenant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orion
volumes:
  pgdata:
networks:
  orion:
    driver: bridge
