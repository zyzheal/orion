apiVersion: v1
kind: Service
metadata:
  name: orion-artifact-svc
  namespace: orion
  labels:
    app: orion-artifact-svc
    component: artifact-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3014
      protocol: TCP
  selector:
    app: orion-artifact-svc
---
apiVersion: v1
kind: Service
metadata:
  name: orion-artifact-svc-nodeport
  namespace: orion
  labels:
    app: orion-artifact-svc
    component: artifact-service
spec:
  type: NodePort
  ports:
    - name: http
      port: 3014
      targetPort: 3014
      nodePort: 30114
      protocol: TCP
  selector:
    app: orion-artifact-svc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-artifact-svc-hpa
  namespace: orion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-artifact-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orion-artifact-config
  namespace: orion
data:
  DB_HOST: "postgres.orion.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "artifact_db"
  CORS_ORIGIN: "https://orion.example.com"
  LOG_LEVEL: "info"
  STORAGE_PATH: "/var/lib/artifacts"
  STORAGE_TYPE: "local"
---
apiVersion: v1
kind: Secret
metadata:
  name: orion-artifact-secrets
  namespace: orion
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "changeme"