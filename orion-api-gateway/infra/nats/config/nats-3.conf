# NATS Server Configuration - Node 1
# Orion Platform - NATS JetStream Cluster

server_name: nats-3
port: 4222
monitor_port: 8222

# ==================== JetStream Configuration ====================
jetstream {
    max_mem_store: 4GB
    max_file_store: 100GB
    store_dir: /data/jetstream
}

# ==================== Cluster Configuration ====================
cluster {
    name: orion-nats-cluster
    host: 0.0.0.0
    port: 6222

    # 集群路由配置
    routes: [
        nats://nats-2:6222
        nats://nats-3:6222
    ]

    # 集群认证
    authorization {
        user: cluster_user
        password: cluster_secret_password_2026
    }

    # 压缩配置
    compression: s2_auto
}

# ==================== Gateway Configuration (可选，用于多集群) ====================
gateway {
    name: orion-gateway
    port: 7222
}

# ==================== Logging Configuration ====================
log_file: /var/log/nats/nats.log
log_time: true
log_datestamp: true
log_connect_error_codes: true

# 日志级别：debug, info, warn, error
log: info

# 调试选项（生产环境建议关闭）
debug: false
trace: false

# ==================== Limits Configuration ====================
max_connections: 10000
max_subscriptions: 100000
max_payload: 8MB
max_pending: 64MB

# ==================== Authorization ====================
authorization {
    # 默认超时
    timeout: 2

    # 用户配置
    users: [
        {
            user: admin
            password: admin_secure_password_2026
            permissions: {
                publish: ">"
                subscribe: ">"
            }
        },
        {
            user: service
            password: service_secure_password_2026
            permissions: {
                publish: "orion.>"
                subscribe: "orion.>"
            }
        },
        {
            user: readonly
            password: readonly_secure_password_2026
            permissions: {
                subscribe: ">"
            }
        }
    ]
}

# ==================== System Account ====================
system_account: sys

# ==================== Accounts ====================
accounts: {
    # 系统账户
    sys: {
        users: [
            { user: sys, password: sys_secure_password_2026 }
        ]
    },

    # Orion 主账户
    orion: {
        jetstream: enabled
        users: [
            { user: admin, password: admin_secure_password_2026 },
            { user: service, password: service_secure_password_2026 }
        ],
        exports: [
            # 导出 Stream 供其他账户订阅
            { stream: "orion.>" }
        ],
        imports: [
            # 导入服务响应
            { service: { account: sys, subject: "$SYS.REQ.>" } }
        ]
    }
}

# ==================== Operator Configuration (可选) ====================
# operator: eyJ0eXAiOiJKV1QiLCJhbGciOiJlZDI1NTE5LW5rZXkifQ...

# ==================== WebSocket Support ====================
websocket {
    listen: 0.0.0.0:8080
    no_tls: true
    compression: true
}

# ==================== MQTT Support (可选) ====================
# mqtt {
#     listen: 0.0.0.0:1883
# }
