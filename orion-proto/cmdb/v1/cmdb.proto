syntax = "proto3";

package cmdb.v1;

option go_package = "github.com/orion-platform/orion-proto/cmdb/v1";

import "common.proto";

// ============ Messages ============

message CI {
    string id = 1;
    string ci_type = 2;
    string name = 3;
    string description = 4;
    map<string, string> attributes = 5;
    int64 created_at = 6;
    int64 updated_at = 7;
    string created_by = 8;
    string updated_by = 9;
}

message Relation {
    string id = 1;
    string source_ci_id = 2;
    string target_ci_id = 3;
    string relation_type = 4;
    map<string, string> attributes = 5;
    int64 created_at = 6;
}

message TopologyNode {
    string ci_id = 1;
    string ci_type = 2;
    string name = 3;
    map<string, string> attributes = 4;
    repeated string children = 5;
}

message TopologyEdge {
    string source_ci_id = 1;
    string target_ci_id = 2;
    string relation_type = 3;
}

message Topology {
    string root_ci_id = 1;
    repeated TopologyNode nodes = 2;
    repeated TopologyEdge edges = 3;
}

message ImpactAnalysis {
    string ci_id = 1;
    string ci_name = 2;
    repeated CI affected_cis = 3;
    repeated Relation affected_relations = 4;
    int32 depth = 5;
}

message CIListRequest {
    string ci_type = 1;
    map<string, string> filters = 2;
    common.Pagination pagination = 3;
}

message CIListResponse {
    repeated CI cis = 1;
    common.Pagination pagination = 2;
}

message CreateCIRequest {
    CI ci = 1;
}

message CreateCIResponse {
    CI ci = 1;
}

message GetCIRequest {
    string id = 1;
}

message UpdateCIRequest {
    CI ci = 1;
}

message UpdateCIResponse {
    CI ci = 1;
}

message DeleteCIRequest {
    string id = 1;
}

message DeleteCIResponse {
    bool success = 1;
}

message CreateRelationRequest {
    Relation relation = 1;
}

message CreateRelationResponse {
    Relation relation = 1;
}

message DeleteRelationRequest {
    string id = 1;
}

message DeleteRelationResponse {
    bool success = 1;
}

message GetRelationsRequest {
    string source_ci_id = 1;
    string target_ci_id = 2;
    string relation_type = 3;
}

message GetRelationsResponse {
    repeated Relation relations = 1;
}

message GetTopologyRequest {
    string root_ci_id = 1;
    int32 depth = 2;
}

message GetTopologyResponse {
    Topology topology = 1;
}

message AnalyzeImpactRequest {
    string ci_id = 1;
    int32 max_depth = 2;
}

message AnalyzeImpactResponse {
    ImpactAnalysis analysis = 1;
}

message SyncHostsRequest {
    string source = 1;
    map<string, string> options = 2;
}

message SyncHostsResponse {
    int32 synced = 1;
    int32 created = 2;
    int32 updated = 3;
    int32 deleted = 4;
    repeated string errors = 5;
}

// ============ Service ============

service CMDBService {
    rpc CreateCI(CreateCIRequest) returns (CreateCIResponse);
    rpc GetCI(GetCIRequest) returns (CI);
    rpc UpdateCI(UpdateCIRequest) returns (UpdateCIResponse);
    rpc DeleteCI(DeleteCIRequest) returns (DeleteCIResponse);
    rpc ListCIs(CIListRequest) returns (CIListResponse);
    rpc CreateRelation(CreateRelationRequest) returns (CreateRelationResponse);
    rpc DeleteRelation(DeleteRelationRequest) returns (DeleteRelationResponse);
    rpc GetRelations(GetRelationsRequest) returns (GetRelationsResponse);
    rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);
    rpc AnalyzeImpact(AnalyzeImpactRequest) returns (AnalyzeImpactResponse);
    rpc SyncHosts(SyncHostsRequest) returns (SyncHostsResponse);
}