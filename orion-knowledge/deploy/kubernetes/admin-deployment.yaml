# ──────────────────────────────────────────────────────────
# Admin UI Deployment + Service (管理端 - React + Nginx)
# ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: orion-knowledge-admin
  namespace: orion-knowledge
  labels:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: admin
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-knowledge-admin
  namespace: orion-knowledge
  labels:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-knowledge
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-knowledge
        app.kubernetes.io/component: admin
    spec:
      containers:
        - name: admin
          image: orion-knowledge-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: NGINX_API_PROXY
              valueFrom:
                configMapKeyRef:
                  name: knowledge-config
                  key: NGINX_API_PROXY
            - name: BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: knowledge-config
                  key: BASE_PATH
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
