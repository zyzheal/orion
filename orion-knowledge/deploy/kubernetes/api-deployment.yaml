# ──────────────────────────────────────────────────────────
# API Service Deployment + Service + HPA
# ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: orion-knowledge-api
  namespace: orion-knowledge
  labels:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: api
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-knowledge-api
  namespace: orion-knowledge
  labels:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-knowledge
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-knowledge
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: orion-knowledge-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: knowledge-secrets
                  key: PG_DSN
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: knowledge-config
                  key: REDIS_ADDR
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knowledge-secrets
                  key: REDIS_PASSWORD
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: knowledge-config
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledge-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledge-secrets
                  key: S3_SECRET_KEY
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: knowledge-config
                  key: S3_BUCKET
            - name: S3_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: knowledge-config
                  key: S3_USE_SSL
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: knowledge-config
                  key: NATS_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: knowledge-config
                  key: LOG_LEVEL
            - name: BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: knowledge-config
                  key: BASE_PATH
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-knowledge-api-hpa
  namespace: orion-knowledge
  labels:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-knowledge-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
