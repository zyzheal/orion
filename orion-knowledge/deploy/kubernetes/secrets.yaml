apiVersion: v1
kind: Secret
metadata:
  name: knowledge-secrets
  namespace: orion-knowledge
  labels:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # ── PostgreSQL 密码 ─────────────────────────────────────
  PG_PASSWORD: "Knowledge@123"

  # ── Redis 密码 ──────────────────────────────────────────
  REDIS_PASSWORD: "Knowledge@123"

  # ── MinIO 凭证 ──────────────────────────────────────────
  S3_ACCESS_KEY: "knowledge"
  S3_SECRET_KEY: "Knowledge@123"

  # ── MinIO Root (等同于 S3 凭证) ─────────────────────────
  MINIO_ROOT_USER: "knowledge"
  MINIO_ROOT_PASSWORD: "Knowledge@123"

  # ── PostgreSQL DSN (含密码) ─────────────────────────────
  PG_DSN: "host=orion-knowledge-pg user=knowledge password=Knowledge@123 dbname=orion_knowledge port=5432 sslmode=disable TimeZone=Asia/Shanghai"

  # ── Redis 连接串 (含密码) ───────────────────────────────
  REDIS_CONN: "redis://:Knowledge@123@orion-knowledge-redis:6379/0"
