# ──────────────────────────────────────────────────────────
# NATS Deployment + Service (JetStream 启用)
# ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: orion-knowledge-nats
  namespace: orion-knowledge
  labels:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: nats
spec:
  ports:
    - port: 4222
      targetPort: 4222
      name: client
    - port: 6222
      targetPort: 6222
      name: cluster
    - port: 8222
      targetPort: 8222
      name: monitoring
  selector:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: nats
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-knowledge-nats
  namespace: orion-knowledge
  labels:
    app.kubernetes.io/name: orion-knowledge
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-knowledge
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-knowledge
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args:
            - "--js"
            - "--store_dir"
            - "/var/lib/nats"
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 6222
              name: cluster
            - containerPort: 8222
              name: monitoring
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
