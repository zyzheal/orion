      reportType:
        type: string
      score:
        description: 0-100 overall
        type: number
      totalControls:
        type: integer
    type: object
info:
  contact: {}
paths:
  /audit/compliance/soc2:
    get:
      consumes:
      - application/json
      description: Get SOC2 Type II compliance report
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orion_platform-svc-go_internal_audit_models.ComplianceReport'
      summary: SOC2 compliance report
      tags:
      - audit
  /audit/logs:
    get:
      consumes:
      - application/json
      description: List audit logs with pagination and filtering
      parameters:
      - description: log ID
        in: path
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditLogListResult'
      summary: List audit logs
      tags:
      - audit
    post:
      consumes:
      - application/json
      description: Create a new audit log entry
      parameters:
      - description: log data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AuditLogCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AuditLogEntry'
      summary: Create audit log
      tags:
      - audit
  /audit/report/generate:
    post:
      consumes:
      - application/json
      description: Generate an audit/compliance report on demand
      parameters:
      - description: framework (soc2/iso27001/combined)
        in: query
        name: framework
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      summary: Generate audit report
      tags:
      - audit
  /audit/reports:
    get:
      consumes:
      - application/json
      description: List all available audit/compliance reports
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      summary: List audit reports
      tags:
      - audit
swagger: "2.0"
