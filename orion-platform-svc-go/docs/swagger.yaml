  models.AuditLogListResult:
    properties:
      entries:
        items:
          $ref: '#/definitions/models.AuditLogEntry'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  models.ControlResult:
    properties:
      details:
        type: string
      evidenceCount:
        type: integer
      id:
        type: string
      name:
        type: string
      status:
        description: passed / failed / warning
        type: string
    type: object
  orion_platform-svc-go_internal_audit_models.ComplianceFinding:
    properties:
      controlId:
