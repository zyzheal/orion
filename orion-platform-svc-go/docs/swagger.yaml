definitions:
  gin.H:
    additionalProperties: {}
    type: object
  models.AuditLogCreateRequest:
    properties:
      action:
        type: string
      details:
        additionalProperties: {}
        type: object
      ipAddress:
        type: string
      requestBody:
        additionalProperties: {}
        type: object
      requestMethod:
        type: string
      requestPath:
        type: string
      resourceId:
        type: string
      resourceType:
        type: string
      responseBody:
        additionalProperties: {}
        type: object
      responseCode:
        type: integer
      tenantId:
        type: string
      userAgent:
        type: string
      userId:
        type: string
    required:
    - action
    type: object
  models.AuditLogEntry:
    properties:
      action:
        type: string
      chainHash:
        type: string
      contentHash:
        type: string
      details:
        additionalProperties: {}
        type: object
      id:
        type: string
      ipAddress:
        type: string
      prevHash:
        type: string
      requestMethod:
        type: string
      requestPath:
        type: string
      resource:
