version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: orion-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oriondev}
      POSTGRES_DB: ${POSTGRES_DB:-orion}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../orion-platform-svc-go/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: orion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: orion-nats
    restart: unless-stopped
    ports:
      - "4222:4222"    # Client port
      - "8222:8222"    # HTTP monitoring
    command: ["--jetstream", "--store_dir=/nats/data", "--port=4222", "--http_port=8222"]
    volumes:
      - nats-data:/nats/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  nats-data:
