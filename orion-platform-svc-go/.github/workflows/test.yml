# Integration & matrix test pipeline for Orion Platform Service (Go) and Frontend.
# Run on every push / PR. Covers:
#   - Go version matrix (1.21+)
#   - Unit tests + coverage report (Go)
#   - Integration tests with PostgreSQL + Redis services
#   - Frontend vitest + coverage report
name: Integration Tests

on:
  push:
    branches: [main, develop, 'fix/*', 'feat/*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: orion-platform-svc

jobs:
  # ========================================================================
  # Go Matrix: build + unit tests across supported Go versions
  # ========================================================================
  go-matrix:
    name: Go ${{ matrix.go-version }} - Build & Unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.21', '1.22', '1.23', '1.24', '1.25']

    defaults:
      run:
        working-directory: orion-platform-svc-go

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: orion-platform-svc-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -trimpath -o /dev/null ./cmd/server

      - name: Build all internal packages
        run: go build ./internal/...

      - name: Type check
        run: go vet ./...

      - name: Unit tests
        run: go test -v -count=1 -timeout=10m ./internal/...

  # ========================================================================
  # Go Coverage: collect coverage profile + generate report
  # ========================================================================
  go-coverage:
    name: Go Coverage Report
    runs-on: ubuntu-latest
    needs: go-matrix

    defaults:
      run:
        working-directory: orion-platform-svc-go

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: orion-platform-svc-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Collect coverage
        run: |
          go test -v -count=1 -timeout=20m -coverprofile=coverage.out -covermode=atomic \
            -coverpkg=./internal/... ./internal/...

      - name: Generate HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-report
          path: |
            orion-platform-svc-go/coverage.out
            orion-platform-svc-go/coverage.html
          retention-days: 7

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: orion-platform-svc-go/coverage.out
          flags: go
          fail_ci_if_error: false

  # ========================================================================
  # Go Integration Tests: full suite against PostgreSQL + Redis
  # ========================================================================
  go-integration:
    name: Go Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: orion-platform-svc-go

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orion_test
        ports:
          - 5432:5432
        options: >-
          --healthcmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --healthcmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: orion-platform-svc-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Integration tests (DB + Redis)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: orion_test
          REDIS_ADDR: localhost:6379
        run: |
          go test -v -race -count=1 -timeout=15m \
            -tags=integration \
            ./internal/...

      - name: Integration tests (no tags fallback)
        if: always()
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: orion_test
          REDIS_ADDR: localhost:6379
        run: |
          go test -v -race -count=1 -timeout=15m ./internal/...

  # ========================================================================
  # Frontend: vitest + coverage report
  # ========================================================================
  frontend:
    name: Frontend vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: orion-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: orion-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check || true

      - name: Run vitest
        run: npx vitest run --no-watch --passWithNoTests

      - name: Collect vitest coverage
        run: npx vitest run --coverage --no-watch --passWithNoTests

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: orion-frontend/coverage
          retention-days: 7

      - name: Upload to Codecov (frontend)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: orion-frontend/coverage/*.json
          flags: frontend
          fail_ci_if_error: false

  # ========================================================================
  # Lint (single shared job)
  # ========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: orion-platform-svc-go/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.61
          working-directory: orion-platform-svc-go
          args: --timeout=10m

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: orion-frontend/package-lock.json

      - name: Frontend lint
        working-directory: orion-frontend
        run: npm ci && npm run lint || true
