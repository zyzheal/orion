# Nginx Configuration for Sub-Application Independent Access
#
# This configuration ensures all API requests from sub-applications
# go through the API Gateway for unified JWT authentication.
# Sub-applications should NOT be directly accessible for API calls.
#
# Usage: Deploy this config for each sub-application domain.

# ==================== orion-dba Independent Access ====================
server {
    listen 80;
    server_name dba.orion.example.com;

    # Force HTTPS redirect (production should use HTTPS)
    # return 301 https://$host$request_uri;

    # Static assets (sub-app frontend build output)
    location / {
        root /var/www/orion-dba/dist;
        try_files $uri $uri/ /index.html;
    }

    # API requests → MUST go through Gateway
    location /api/ {
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check endpoint
    location /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Block direct access to sub-app backend
    # (No proxy_pass to orion-dba:port - all API goes through Gateway)
}

# ==================== orion-knowledge Independent Access ====================
server {
    listen 80;
    server_name knowledge.orion.example.com;

    # Static assets
    location / {
        root /var/www/orion-knowledge/dist;
        try_files $uri $uri/ /index.html;
    }

    # API requests → Gateway
    location /api/ {
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

# ==================== Main Application (Primary Domain) ====================
server {
    listen 80;
    server_name orion.example.com;

    # Frontend static assets
    location / {
        root /var/www/orion-frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # All API requests → Gateway
    location /api/ {
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SSO callback endpoint (for independent domain access)
    location /auth/callback {
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
