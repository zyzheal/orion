scope: orion-cluster
namespace: /db/
name: pg-node

restapi:
  listen: 0.0.0.0:8008
  connect_address: 0.0.0.0:8008
  username: patroni
  password: patroni_password

etcd:
  hosts:
    - etcd1:2379
    - etcd2:2379
    - etcd3:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        hot_standby_feedback: true
        wal_keep_size: 1GB
        synchronous_commit: on
        synchronous_standby_names: "*"
        archive_mode: "on"
        archive_command: '/bin/true'
        shared_buffers: 256MB
        work_mem: 16MB
        maintenance_work_mem: 128MB
        effective_cache_size: 1GB
        checkpoint_completion_target: 0.9
        random_page_cost: 1.1

  initdb:
    - encoding: UTF8
    - data-checksums
    - locale: en_US.UTF-8

  pg_hba:
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256
    - host all all ::0/0 scram-sha-256

  users:
    username: postgres
    password: postgres_password
    options:
      - createrole
      - createdb

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: replicator_password
    superuser:
      username: postgres
      password: postgres_password
  parameters:
    unix_socket_directories: '.'

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
