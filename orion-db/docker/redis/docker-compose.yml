version: '3.8'

services:
  # Redis 主节点
  redis-master:
    image: redis:7-alpine
    container_name: orion-redis-master
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
      - ./config/redis-master.conf:/etc/redis/redis.conf:ro
    networks:
      - orion-redis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 从节点 1
  redis-replica1:
    image: redis:7-alpine
    container_name: orion-redis-replica1
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6380:6379"
    volumes:
      - redis_replica1_data:/data
      - ./config/redis-replica.conf:/etc/redis/redis.conf:ro
    networks:
      - orion-redis-network
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 从节点 2
  redis-replica2:
    image: redis:7-alpine
    container_name: orion-redis-replica2
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6381:6379"
    volumes:
      - redis_replica2_data:/data
      - ./config/redis-replica.conf:/etc/redis/redis.conf:ro
    networks:
      - orion-redis-network
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Sentinel - 高可用
  redis-sentinel1:
    image: redis:7-alpine
    container_name: orion-redis-sentinel1
    command: redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "26379:26379"
    volumes:
      - ./config/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - orion-redis-network
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel2:
    image: redis:7-alpine
    container_name: orion-redis-sentinel2
    command: redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "26380:26379"
    volumes:
      - ./config/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - orion-redis-network
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel3:
    image: redis:7-alpine
    container_name: orion-redis-sentinel3
    command: redis-sentinel /etc/redis/sentinel.conf
    ports:
      - "26381:26379"
    volumes:
      - ./config/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - orion-redis-network
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26381", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  orion-redis-network:
    driver: bridge

volumes:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:
