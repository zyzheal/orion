apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-agent-svc
  namespace: orion
  labels:
    app: orion-agent-svc
    version: v1
    component: agent-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-agent-svc
  template:
    metadata:
      labels:
        app: orion-agent-svc
        version: v1
        component: agent-service
    spec:
      containers:
        - name: agent-svc
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: orion-agent-svc:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3007
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3007"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: orion-agent-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: orion-agent-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: orion-agent-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orion-agent-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orion-agent-secrets
                  key: DB_PASSWORD
            - name: DB_POOL_SIZE
              value: "10"
            - name: LOG_LEVEL
              value: "info"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: orion-agent-config
                  key: CORS_ORIGIN
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: orion-agent-config
                  key: REDIS_HOST
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
