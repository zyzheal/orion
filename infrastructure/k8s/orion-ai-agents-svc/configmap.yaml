apiVersion: v1
kind: ConfigMap
metadata:
  name: orion-ai-agents-svc-config
  namespace: orion
  labels:
    app: orion-ai-agents-svc
    app.kubernetes.io/part-of: orion-platform
data:
  environment: "development"
  database_url: "postgres://orion:orion@postgres:5432/orion_orion_ai_agents_svc?sslmode=disable"
  redis_addr: "redis:6379"
  nats_addr: "nats://nats:4222"
  nats_stream: "EVENTS"
