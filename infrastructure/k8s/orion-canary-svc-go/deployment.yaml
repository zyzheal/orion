apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-canary-svc-go
  namespace: orion
  labels:
    app: orion-canary-svc-go
    app.kubernetes.io/name: orion-canary-svc-go
    app.kubernetes.io/part-of: orion-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-canary-svc-go
  template:
    metadata:
      labels:
        app: orion-canary-svc-go
        app.kubernetes.io/name: orion-canary-svc-go
        app.kubernetes.io/part-of: orion-platform
    spec:
      containers:
      - name: orion-canary-svc-go
        image: orion/orion-canary-svc-go:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVICE_NAME
          value: orion-canary-svc-go
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: orion-canary-svc-go-config
              key: environment
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: orion-canary-svc-go-config
              key: database_url
        - name: REDIS_ADDR
          valueFrom:
            configMapKeyRef:
              name: orion-canary-svc-go-config
              key: redis_addr
        - name: JWT_SECRET
          valueFrom:
            secretRef:
              name: orion-secrets
              key: jwt-secret
        - name: NATS_ADDR
          valueFrom:
            configMapKeyRef:
              name: orion-canary-svc-go-config
              key: nats_addr
        - name: NATS_STREAM
          valueFrom:
            configMapKeyRef:
              name: orion-canary-svc-go-config
              key: nats_stream
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
