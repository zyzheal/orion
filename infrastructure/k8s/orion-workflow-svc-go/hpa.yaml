apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-workflow-svc-go
  namespace: orion
  labels:
    app: orion-workflow-svc-go
    app.kubernetes.io/part-of: orion-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-workflow-svc-go
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
