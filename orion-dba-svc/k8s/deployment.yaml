apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-dba-svc
  namespace: orion
  labels:
    app: orion-dba
    version: v1
    component: dba-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-dba
  template:
    metadata:
      labels:
        app: orion-dba
        version: v1
        component: dba-service
    spec:
      containers:
        - name: dba
          image: orion-dba-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3031
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3031"
            - name: HOST
              value: "0.0.0.0"
            - name: YEARNING_URL
              valueFrom:
                configMapKeyRef:
                  name: orion-dba-config
                  key: yearning-url
                  optional: true
            - name: YEARNING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orion-dba-secrets
                  key: yearning-api-key
                  optional: true
            - name: DBA_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orion-dba-secrets
                  key: service-api-key
                  optional: true
            - name: LOG_LEVEL
              value: "info"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: orion-dba-config
                  key: cors-origin
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3031
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3031
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: orion-dba
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "node-type"
          operator: "Equal"
          value: "general"
          effect: "NoSchedule"