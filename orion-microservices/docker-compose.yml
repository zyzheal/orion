name: ${COMPOSE_PROJECT_NAME:-orion}

# ==========================================
# Orion Microservices Orchestrator
# 生产环境 Docker Compose 编排配置
# ==========================================

networks:
  orion-internal:
    driver: bridge
  orion-public:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local

# ==========================================
# 基础设施服务
# ==========================================
services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: unless-stopped
    networks:
      - orion-internal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orion_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orion}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: orion-redis
    restart: unless-stopped
    networks:
      - orion-internal
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- NATS JetStream ---
  nats:
    image: nats:2.10-alpine
    container_name: orion-nats
    restart: unless-stopped
    networks:
      - orion-internal
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MANAGEMENT_PORT:-8222}:8222"
    command: >
      --js
      --store_dir /data/jetstream
      --http_port 8222
      --auth ${NATS_TOKEN:-nats_secret}
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 应用服务
  # ==========================================

  # --- orion-platform-core (基础服务，其他服务依赖它) ---
  orion-platform-core:
    image: orion/platform-core:${PLATFORM_VERSION:-latest}
    container_name: orion-platform-core
    restart: unless-stopped
    networks:
      - orion-internal
      - orion-public
    ports:
      - "${PLATFORM_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-orion}:${POSTGRES_PASSWORD:-orion_secret}@postgres:5432/platform_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      NATS_URL: nats://:${NATS_TOKEN:-nats_secret}@nats:4222
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- orion-gateway (统一 API 入口) ---
  orion-gateway:
    image: orion/gateway:${GATEWAY_VERSION:-latest}
    container_name: orion-gateway
    restart: unless-stopped
    networks:
      - orion-public
      - orion-internal
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      PLATFORM_SERVICE_URL: http://orion-platform-core:3001
      PIPELINE_SERVICE_URL: http://orion-pipeline-svc:3002
      DEPLOY_SERVICE_URL: http://orion-deploy-svc:3003
      TICKET_SERVICE_URL: http://orion-ticket-svc:3004
      MONITOR_SERVICE_URL: http://orion-monitor-svc:3005
      INTELLIGENCE_SERVICE_URL: http://orion-intelligence-svc:3006
      AGENT_SERVICE_URL: http://orion-agent-svc:3007
      KNOWLEDGE_SERVICE_URL: http://orion-knowledge-svc:3008
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      orion-platform-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- orion-pipeline-svc ---
  orion-pipeline-svc:
    image: orion/pipeline-svc:${PIPELINE_VERSION:-latest}
    container_name: orion-pipeline-svc
    restart: unless-stopped
