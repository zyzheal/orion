      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      NATS_URL: nats://:${NATS_TOKEN:-nats_secret}@nats:4222
      PLATFORM_SERVICE_URL: http://orion-platform-core:3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
