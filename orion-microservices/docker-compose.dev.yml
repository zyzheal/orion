# ==========================================
# Orion Microservices - 开发环境覆盖
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==========================================

services:
  # --- PostgreSQL: 暴露端口，关闭 WAL 保护 ---
  postgres:
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c log_statement=all
    ports:
      - "5432:5432"

  # --- Redis: 关闭密码（开发便利） ---
  redis:
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --protected-mode no

  # --- NATS: 关闭认证 ---
  nats:
    command: >
      --js
      --store_dir /data/jetstream
      --http_port 8222

  # --- orion-platform-core: 开发模式 ---
  orion-platform-core:
    build:
      context: ../orion-platform-core
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - ../orion-platform-core:/app
      - platform_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
      - "9229:9229"
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

  # --- orion-gateway: 开发模式 ---
  orion-gateway:
    build:
      context: ../orion-api-gateway
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - ../orion-api-gateway:/app
      - gateway_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
      - "9230:9229"
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

  # --- orion-pipeline-svc: 开发模式 ---
  orion-pipeline-svc:
    build:
      context: ../orion-pipeline-svc
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - ../orion-pipeline-svc:/app
      - pipeline_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3002:3002"
      - "9231:9229"
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

  # --- orion-deploy-svc: 开发模式 ---
  orion-deploy-svc:
    build:
      context: ../orion-deploy-svc
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - ../orion-deploy-svc:/app
      - deploy_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3003:3003"
      - "9232:9229"
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

  # --- orion-ticket-svc: 开发模式 ---
  orion-ticket-svc:
    build:
      context: ../orion-ticket-svc
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - ../orion-ticket-svc:/app
      - ticket_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3004:3004"
      - "9233:9229"
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

  # --- orion-monitor-svc: 开发模式 ---
  orion-monitor-svc:
    build:
      context: ../orion-monitor-svc
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - ../orion-monitor-svc:/app
      - monitor_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3005:3005"
      - "9234:9229"
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

  # --- orion-intelligence-svc: 开发模式 (Python) ---
  orion-intelligence-svc:
    build:
      context: ../orion-intelligence-svc
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - ../orion-intelligence-svc:/app
    environment:
      ENV: development
      LOG_LEVEL: debug
    ports:
      - "3006:3006"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "3006", "--reload"]

  # --- orion-agent-svc: 开发模式 ---
  orion-agent-svc:
    build:
      context: ../orion-agent-svc
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - ../orion-agent-svc:/app
      - agent_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3007:3007"
      - "9235:9229"
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

  # --- orion-knowledge-svc: 开发模式 ---
  orion-knowledge-svc:
    build:
      context: ../orion-knowledge-svc
      dockerfile: Dockerfile.dev
      target: dev
    volumes:
      - ../orion-knowledge-svc:/app
      - knowledge_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3008:3008"
      - "9236:9229"
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]

volumes:
  platform_dev_node_modules:
  gateway_dev_node_modules:
  pipeline_dev_node_modules:
  deploy_dev_node_modules:
  ticket_dev_node_modules:
  monitor_dev_node_modules:
  agent_dev_node_modules:
  knowledge_dev_node_modules:
